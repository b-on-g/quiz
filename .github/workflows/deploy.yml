name: $bog_quiz

permissions: write-all

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * *"

env:
  REPO_OWNER: ${{ github.repository_owner }}
  REPO_NAME: ${{ github.event.repository.name }}
  # https://<org>.github.io/<repo>/
  PWA_PUBLIC_URL: ${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: hyoo-ru/mam_build@master2
        with:
          package: 'bog/quiz'

      - uses: hyoo-ru/gh-deploy@v4.4.1
        if: github.ref == 'refs/heads/master'
        with:
          folder: 'bog/quiz/-'

  desktop_linux:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    continue-on-error: true

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Build & zip Linux app
        run: |
          set -e
          APP_NAME="${GITHUB_REPOSITORY##*/}"

          nativefier "$PWA_PUBLIC_URL" \
            --name "$APP_NAME" \
            --platform linux \
            --arch x64 \
            --disable-dev-tools \
            --single-instance

          echo "Workspace after nativefier:"
          ls -la

          OUT_DIR=$(ls -d "${APP_NAME}-linux-"* 2>/dev/null | head -n 1)
          if [ -z "$OUT_DIR" ]; then
            echo "No output dir like ${APP_NAME}-linux-* found" >&2
            exit 1
          fi

          mkdir -p artifacts
          zip -r "artifacts/${APP_NAME}-linux-x64.zip" "$OUT_DIR"
          ls -la artifacts

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: artifacts/*.zip

  desktop_macos:
    needs: build
    runs-on: macos-latest
    if: github.ref == 'refs/heads/master'
    continue-on-error: true

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Build & zip macOS app
        run: |
          set -e
          APP_NAME="${GITHUB_REPOSITORY##*/}"

          nativefier "$PWA_PUBLIC_URL" \
            --name "$APP_NAME" \
            --platform darwin \
            --arch x64 \
            --disable-dev-tools \
            --single-instance

          echo "Workspace after nativefier:"
          ls -la

          OUT_DIR=$(ls -d "${APP_NAME}-darwin-"* 2>/dev/null | head -n 1)
          if [ -z "$OUT_DIR" ]; then
            echo "No output dir like ${APP_NAME}-darwin-* found" >&2
            exit 1
          fi

          mkdir -p artifacts
          zip -r "artifacts/${APP_NAME}-macos-x64.zip" "$OUT_DIR"
          ls -la artifacts

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: artifacts/*.zip
  
  desktop_windows:
    needs: build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/master'
    continue-on-error: true

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Build & zip Windows app
        shell: pwsh
        run: |
          $appName = $env:GITHUB_REPOSITORY.Split('/')[-1]
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          nativefier "$env:PWA_PUBLIC_URL" `
            --name "$appName" `
            --platform windows `
            --arch x64 `
            --disable-dev-tools `
            --single-instance `
            --out dist
          Write-Host "dist contents after nativefier:"
          Get-ChildItem -Recurse dist
          $zipPath = "dist/$appName-windows-x64.zip"
          Compress-Archive -Path dist\* -DestinationPath $zipPath -Force
          Get-ChildItem dist

      - name: Archive Windows app
        shell: pwsh
        run: |
          $appName = $env:GITHUB_REPOSITORY.Split('/')[-1]
          $dir = Get-ChildItem -Directory | Where-Object Name -like "$appName-win32-*" | Select-Object -First 1
          if (-not $dir) { throw "No output dir like $appName-win32-* found" }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path $dir.FullName -DestinationPath "artifacts/$appName-windows-x64.zip" -Force
          Get-ChildItem artifacts

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: artifacts/*.zip
          if-no-files-found: error
 
  
  vk_miniapp:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && vars.VK_MINIAPP_APP_ID != '' 
    continue-on-error: true

    env:
      VK_MINIAPP_APP_ID: ${{ vars.VK_MINIAPP_APP_ID }}
      MINI_APPS_ACCESS_TOKEN: ${{ secrets.VK_MINI_APPS_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch gh-pages into worktree
        run: |
          git fetch origin gh-pages || echo "no gh-pages yet"
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add gh-pages origin/gh-pages
          else
            echo "gh-pages branch not found, skip VK deploy"
            exit 0
          fi

      - name: Generate vk-hosting-config.json
        run: |
          cat > vk-hosting-config.json <<EOF
          {
            "static_path": "gh-pages",
            "app_id": ${VK_MINIAPP_APP_ID},
            "endpoints": {
              "mobile": "index.html",
              "mvk": "index.html",
              "web": "index.html"
            }
          }
          EOF
          cat vk-hosting-config.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install VK Mini Apps deploy
        run: npm install -g @vkontakte/vk-miniapps-deploy

      - name: Deploy to VK Mini Apps hosting
        run: vk-miniapps-deploy

  android_twa:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    continue-on-error: true

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap + expect
        run: |
          npm install -g @bubblewrap/cli
          sudo apt-get update
          sudo apt-get install -y expect

      - name: Init & build TWA (non-interactive)
        env:
          KEYSTORE_PASSWORD: password
          KEY_PASSWORD: password
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY##*/}"
          OWNER="${GITHUB_REPOSITORY%/*}"

          MANIFEST_URL="${PWA_PUBLIC_URL}manifest.webmanifest"
          if ! curl -fsI "$MANIFEST_URL" >/dev/null 2>&1; then
            MANIFEST_URL="${PWA_PUBLIC_URL}manifest.json"
          fi
          echo "Using manifest: $MANIFEST_URL"

          JDK_PATH="${JAVA_HOME_17_X64:-${JAVA_HOME:-/usr/lib/jvm/temurin-17-jdk-amd64}}"
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "JDK: $JDK_PATH"
          echo "SDK: $SDK_PATH"

          OWNER_SAFE="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')"
          REPO_SAFE="$(echo "$REPO" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')"
          PACKAGE_ID="app.${OWNER_SAFE}.${REPO_SAFE}"
          echo "PACKAGE_ID: $PACKAGE_ID"

          rm -rf twa
          mkdir -p twa
          cd twa

          bubblewrap updateConfig --jdkPath="$JDK_PATH" --androidSdkPath="$SDK_PATH"

          cat > bwrap.expect <<'EXP'
          #!/usr/bin/expect -f
          set timeout 1200

          set manifest [lindex $argv 0]
          set jdk      [lindex $argv 1]
          set sdk      [lindex $argv 2]
          set appName  [lindex $argv 3]
          set package  [lindex $argv 4]
          set kspass   [lindex $argv 5]
          set kpass    [lindex $argv 6]

          spawn bubblewrap init --manifest=$manifest --directory=.

          expect {
            -nocase -re "install the JDK.*\\(Y/n\\)"          { send "n\r"; exp_continue }
            -nocase -re "Path to your existing JDK"          { send "$jdk\r"; exp_continue }
            -nocase -re "install the Android SDK.*\\(Y/n\\)" { send "n\r"; exp_continue }
            -nocase -re "Path to your existing Android SDK"  { send "$sdk\r"; exp_continue }

            -nocase -re "application name"                   { send "$appName\r"; exp_continue }
            -nocase -re "launcher name"                      { send "$appName\r"; exp_continue }
            -nocase -re "package.*id"                        { send "$package\r"; exp_continue }

            -nocase -re "create.*signing.*key"               { send "y\r"; exp_continue }
            -nocase -re "keystore.*path|path.*keystore"      { send "keystore.jks\r"; exp_continue }
            -nocase -re "keystore.*password"                 { send "$kspass\r"; exp_continue }
            -nocase -re "key alias"                          { send "release\r"; exp_continue }
            -nocase -re "key password"                       { send "$kpass\r"; exp_continue }

            -nocase -re "\\? .*"                             { send "\r"; exp_continue }
            eof
          }
          EXP

          chmod +x bwrap.expect
          expect -f bwrap.expect "$MANIFEST_URL" "$JDK_PATH" "$SDK_PATH" "$REPO" "$PACKAGE_ID" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD"

          bubblewrap build --skipPwaValidation || bubblewrap build

          echo "APK/AAB found:"
          find . -maxdepth 6 -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Collect Android artifacts
        run: |
          mkdir -p dist-android
          find twa -maxdepth 6 -type f -name "*.apk" -exec cp {} dist-android/ \; || true
          find twa -maxdepth 6 -type f -name "*.aab" -exec cp {} dist-android/ \; || true
          ls -la dist-android || true

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist-android
          if-no-files-found: error


  # ----------------- RELEASE (GitHub Releases) -----------------
  release:
    needs:
      - desktop_linux
      - desktop_windows
      - desktop_macos
      - android_twa
    runs-on: ubuntu-latest
    if: ${{ always() && github.ref == 'refs/heads/master' && github.event_name == 'push' }}
    continue-on-error: true

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List downloaded artifacts
        run: |
          echo "Downloaded to dist/:"
          ls -la
          ls -R dist || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: ${{ github.event.repository.name }} nightly
          make_latest: true
          overwrite_files: true
          files: |
            dist/**/*.zip
            dist/**/*.apk
            dist/**/*.aab
